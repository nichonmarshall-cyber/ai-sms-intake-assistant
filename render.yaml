databases:
  - name: ntx-sms-intake-db
    plan: free
    databaseName: ntx_sms_intake
    user: ntx_sms_intake

services:
  - type: web
    name: ntx-sms-intake-assistant
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 30"
    healthCheckPath: /health
    envVars:
      - key: APP_MODE
        value: demo
      - key: ENABLED_PROFILES
        value: "auto_repair,roofing,painting,lawn_care,catering"
      - key: SESSION_TTL_MINUTES
        value: "45"
      - key: DEFAULT_TIMEZONE
        value: America/Chicago
      - key: DATABASE_URL
        fromDatabase:
          name: ntx-sms-intake-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: TWILIO_VALIDATION_BYPASS
        value: "false"
      - key: MAX_TURNS
        value: "15"
      - key: MAX_HISTORY
        value: "12"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SHEETS_ENABLED
        value: "false"
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: CLIENT_SHEET_NAME
        value: Leads
      - key: INTERNAL_SHEET_NAME
        value: Internal
